<div id="widget_st_musik" class="card">
  <div class="card-header">
    <span>Musik <span id="now_playing"></span></span>
  </div>
  <div class="card-body">
    <div id="top">
      <div id="track_wrapper">
        <span id="track" />
      </div>
      <div id="duration_wrapper">
        <span id="duration">--:-- / --:--</span>
      </div>
    </div>
    <div id="middle">
      <button class="btn" id="btn_previous_track">⏮</button>
      <button class="btn" id="btn_rewind" disabled>⏴</button>
      <button class="btn btn_primary" id="btn_play">⏯</button>
      <button class="btn" id="btn_forward" disabled>⏵</button>
      <button class="btn" id="btn_next_track">⏭</button>
    </div>
    <div id="bottom">
      <button class="btn">Expand Track List</button>
    </div>
  </div>
</div>
