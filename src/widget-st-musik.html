<div id="widget_st_musik" class="card">
  <div class="card-header">
    <span>Musik <span id="now_playing"></span></span>
  </div>
  <div class="card-body">
    <div id="top">
      <div id="track">
        <span>No track</span>
      </div>
      <div id="duration">
        <span>--:-- / --:--</span>
      </div>
    </div>
    <div id="middle">
      <button class="btn">⏮</button>
      <button class="btn">⏴</button>
      <button class="btn">⏯</button>
      <button class="btn">⏵</button>
      <button class="btn">⏭</button>
    </div>
    <div id="bottom">
      <button class="btn">Expand Track List</button>
    </div>
  </div>
</div>
