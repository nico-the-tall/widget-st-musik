<div id="widget_st_musik" class="widget_st_musik">
  <div class="widget_st_musik_header">
    <span>Musik <span id="widget_st_musik_now_playing"></span></span>
  </div>
  <div class="widget_st_musik">
    <div id="widget_st_musik_top">
      <div id="widget_st_musik_track_wrapper">
        <span id="widget_st_musik_track" />
      </div>
      <div id="widget_st_musik_duration_wrapper">
        <span id="widget_st_musik_duration">--:-- / --:--</span>
      </div>
    </div>
    <div id="widget_st_musik_middle">
      <button id="widget_st_musik_btn_previous_track">⏮</button>
      <button id="widget_st_musik_btn_rewind" disabled>⏴</button>
      <button class="btn_primary" id="widget_st_musik_btn_play">⏯</button>
      <button id="widget_st_musik_btn_forward" disabled>⏵</button>
      <button id="widget_st_musik_btn_next_track">⏭</button>
    </div>
    <div id="widget_st_musik_secondary">
      <button id="widget_st_musik_btn_repeat">R</button>
      <label id="widget_st_musik_volume">
        <span>V</span>
        <input
          id="widget_st_musik_volume_slider"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="1"
        />
      </label>
    </div>
    <div id="widget_st_musik_bottom">
      <button id="widget_st_musik_list_btn" class="widget_st_musik_list_btn">
        Expand Tracks List
      </button>
      <div
        class="widget_st_musik_card_body list_hidden"
        id="widget_st_musik_list"
      />
    </div>
  </div>
</div>
